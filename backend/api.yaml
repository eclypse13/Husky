components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        place:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        certificate:
          type: string
          format: uri
          nullable: true
        achieved_at:
          type: string
          format: date-time
          nullable: true
        user:
          type: integer
        dog:
          type: integer
          nullable: true
        event:
          type: integer
          nullable: true
      required:
      - id
      - user
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application_type:
          $ref: '#/components/schemas/ApplicationTypeEnum'
        payload: {}
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        history: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
      required:
      - application_type
      - created_at
      - id
      - updated_at
      - user
    ApplicationRequest:
      type: object
      properties:
        application_type:
          $ref: '#/components/schemas/ApplicationTypeEnum'
        payload: {}
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        history: {}
        user:
          type: integer
      required:
      - application_type
      - user
    ApplicationStatusEnum:
      enum:
      - new
      - in_progress
      - done
      - rejected
      type: string
      description: |-
        * `new` - Новая
        * `in_progress` - В процессе
        * `done` - Рассмотрена
        * `rejected` - Отклонена
    ApplicationTypeEnum:
      enum:
      - membership
      - litter_registration
      - kennel_registration
      - document_request
      - complaint
      - other
      type: string
      description: |-
        * `membership` - Членство
        * `litter_registration` - Регистрация помёта
        * `kennel_registration` - Регистрация питомника
        * `document_request` - Запрос документов
        * `complaint` - Жалоба
        * `other` - Другое
    BlankEnum:
      enum:
      - ''
    BoardMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        position:
          type: string
          maxLength: 200
        bio_key:
          type: string
          maxLength: 200
