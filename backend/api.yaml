openapi: 3.0.3
info:
  title: НКП Сибирский Хаски API
  version: 1.0.0
  description: API для Национального клуба породы Сибирский хаски
paths:
  /api/activity-feed/:
    get:
      operationId: activity_feed_retrieve
      description: Возвращает последние сообщения из Telegram-канала клуба (кешируется
        на 1 минуту).
      summary: Лента активности
      tags:
      - Home
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeedResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Аутентификация пользователя по email и паролю. Устанавливает сессионный
        cookie.
      summary: Вход в систему
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
          description: Успешная аутентификация
        '401':
          description: Неверный email или пароль
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Завершает текущую сессию пользователя.
      summary: Выход из системы
      tags:
      - Auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Сессия завершена
        '401':
          description: Пользователь не авторизован
  /api/breed/articles/:
    get:
      operationId: breed_articles_list
      description: Возвращает список статей. Поддерживает фильтрацию по категории.
      summary: Список статей о породе
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Категория статьи
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Breed
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreedArticleList'
          description: ''
  /api/breed/articles/{id}/:
    get:
      operationId: breed_articles_retrieve
      description: API статей о породе
      summary: Получить статью о породе по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed article.
        required: true
      tags:
      - Breed
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreedArticle'
          description: ''
        '404':
          description: Статья не найдена
  /api/breed/standards/:
    get:
      operationId: breed_standards_list
      description: API стандартов породы
      summary: Список стандартов породы
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Breed
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreedStandardList'
          description: ''
  /api/breed/standards/{id}/:
    get:
      operationId: breed_standards_retrieve
      description: API стандартов породы
      summary: Получить стандарт породы по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed standard.
        required: true
      tags:
      - Breed
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreedStandard'
          description: ''
        '404':
          description: Стандарт не найден
  /api/breeders/:
    get:
      operationId: breeders_list
      description: ViewSet для заводчиков
      summary: Список заводчиков
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Dog References
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreederList'
          description: ''
  /api/breeders/{id}/:
    get:
      operationId: breeders_retrieve
      description: ViewSet для заводчиков
      summary: Получить заводчика по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Заводчик.
        required: true
      tags:
      - Dog References
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breeder'
          description: ''
        '404':
          description: Заводчик не найден
  /api/club/board/:
    get:
      operationId: club_board_list
      description: API членов Президиума
      summary: Список членов Президиума
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Leadership
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoardMemberList'
          description: ''
  /api/club/board/{id}/:
    get:
      operationId: club_board_retrieve
      description: API членов Президиума
      summary: Получить члена Президиума по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Член клуба.
        required: true
      tags:
      - Leadership
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMember'
          description: ''
        '404':
          description: Член Президиума не найден
  /api/club/documents/:
    get:
      operationId: club_documents_list
      description: API документов клуба
      summary: Список документов клуба
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Club Documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubDocumentList'
          description: ''
  /api/club/documents/{id}/:
    get:
      operationId: club_documents_retrieve
      description: API документов клуба
      summary: Получить документ клуба по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Документ клуба.
        required: true
      tags:
      - Club Documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDocument'
          description: ''
        '404':
          description: Документ не найден
  /api/club/stats/:
    get:
      operationId: club_stats_list
      description: Возвращает последнюю запись статистики клуба. Если данных ещё нет
        — возвращает нулевые значения.
      summary: Статистика клуба
      tags:
      - Club Stats
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubStats'
          description: ''
  /api/dict/:
    get:
      operationId: dict_list
      description: Возвращает все записи контент-справочника. Поддерживает фильтрацию
        по странице и ключу.
      summary: Список контент-записей
      parameters:
      - in: query
        name: key
        schema:
          type: string
        description: Поиск по ключу (частичное совпадение)
      - in: query
        name: page
        schema:
          type: string
        description: Фильтр по странице
      tags:
      - Content Dictionary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContentDictionaryList'
          description: ''
  /api/dict/{id}/:
    get:
      operationId: dict_retrieve
      description: API для контент-справочника
      summary: Получить запись по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this content dictionary.
        required: true
      tags:
      - Content Dictionary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDictionary'
          description: ''
        '404':
          description: Запись не найдена
  /api/dict/by_key/:
    get:
      operationId: dict_by_key_retrieve
      description: Возвращает одну запись контент-справочника по точному совпадению
        ключа.
      summary: Получить значение по ключу
      parameters:
      - in: query
        name: key
        schema:
          type: string
        description: Точный ключ записи
        required: true
      tags:
      - Content Dictionary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentByKeyResponse'
          description: Запись найдена
        '400':
          description: Параметр key не передан
        '404':
          description: Запись с указанным ключом не найдена
  /api/dogs/:
    get:
      operationId: dogs_list
      description: Возвращает пагинированный список собак. Поддерживает поиск и фильтрацию.
      summary: Список собак
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Поиск по кличке (частичное совпадение)
      - in: query
        name: sex
        schema:
          type: integer
        description: Фильтр по полу (1 — кобель, 2 — сука)
      - in: query
        name: year
        schema:
          type: integer
        description: Фильтр по году рождения
      tags:
      - Dogs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDogListList'
          description: ''
  /api/dogs/{id}/:
    get:
      operationId: dogs_retrieve
      description: Возвращает полную информацию о собаке, включая родителей, заводчиков,
        титулы и медицинские записи.
      summary: Детальная информация о собаке
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Собака.
        required: true
      tags:
      - Dogs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDetail'
          description: ''
        '404':
          description: Собака не найдена
  /api/dogs/{id}/calculate_coi/:
    post:
      operationId: dogs_calculate_coi_create
      description: Рассчитывает и сохраняет коэффициент инбридинга (COI) для указанной
        собаки. Глубина расчёта от 1 до 10 поколений.
      summary: Рассчитать COI для собаки
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Собака.
        required: true
      tags:
      - Dogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateCoiRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculateCoiRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculateCoiRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateCoiResponse'
          description: ''
        '404':
          description: Собака не найдена
        '422':
          description: Невозможно рассчитать COI (неполная родословная)
  /api/dogs/{id}/offspring/:
    get:
      operationId: dogs_offspring_list
      description: Возвращает всех потомков собаки (щенков, для которых она является
        отцом или матерью).
      summary: Потомки собаки
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Собака.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Dogs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDogListList'
          description: ''
        '404':
          description: Собака не найдена
  /api/dogs/{id}/pedigree/:
    get:
      operationId: dogs_pedigree_retrieve
      description: Возвращает рекурсивное дерево предков до указанной глубины (1–10
        поколений).
      summary: Родословная собаки
      parameters:
      - in: query
        name: generations
        schema:
          type: integer
        description: Глубина дерева (1–10, по умолчанию 3)
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Собака.
        required: true
      tags:
      - Dogs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedigree'
          description: ''
        '404':
          description: Собака не найдена
  /api/dogs/{id}/siblings/:
    get:
      operationId: dogs_siblings_list
      description: Возвращает братьев и сестёр (однопомётников) собаки.
      summary: Сиблинги собаки
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Собака.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Dogs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDogListList'
          description: ''
        '404':
          description: Собака не найдена
  /api/dogs/coi/recalculate/:
    post:
      operationId: dogs_coi_recalculate_create
      description: Запускает Celery-задачу для пересчёта коэффициента инбридинга (COI)
        для всех собак в базе. Прогресс можно отслеживать через GET /api/dogs/import/status/{task_id}/.
      summary: Массовый пересчёт COI
      tags:
      - Dogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateAllCoiRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecalculateAllCoiRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecalculateAllCoiRequestRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
  /api/dogs/import/breedarchive/browse/:
    post:
      operationId: dogs_import_breedarchive_browse_create
      description: Импорт собак, изменённых за последние N дней, через browse-страницу
        (Playwright).
      summary: Импорт собак через browse-страницу BreedArchive
      tags:
      - Import BreedArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveBrowseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveBrowseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveBrowseRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
        '400':
          description: Ошибки валидации
  /api/dogs/import/breedarchive/dog/:
    post:
      operationId: dogs_import_breedarchive_dog_create
      description: Импорт одной собаки из BreedArchive по UUID.
      summary: Импорт одной собаки из BreedArchive
      tags:
      - Import BreedArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveDogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveDogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveDogRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
        '400':
          description: Ошибки валидации
  /api/dogs/import/breedarchive/dog/full-pedigree/:
    post:
      operationId: dogs_import_breedarchive_dog_full_pedigree_create
      description: Запускает рекурсивную загрузку всех предков из BreedArchive. Каждый
        граничный предок (sire/dam=null, но sireId/damId>0) запрашивается отдельно
        до тех пор, пока не будут загружены все поколения. Возвращает task_id для
        отслеживания прогресса.
      summary: Загрузка полной родословной по UUID (все поколения)
      tags:
      - Import BreedArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveFullPedigreeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveFullPedigreeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveFullPedigreeRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
        '400':
          description: Ошибки валидации
  /api/dogs/import/breedarchive/recent/:
    post:
      operationId: dogs_import_breedarchive_recent_create
      description: Импорт последних обновлённых собак из BreedArchive (operation=all).
      summary: Импорт последних обновлений BreedArchive
      tags:
      - Import BreedArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveRecentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveRecentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBreedarchiveRecentRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
        '400':
          description: Ошибки валидации
  /api/dogs/import/hybrid/dog/:
    post:
      operationId: dogs_import_hybrid_dog_create
      description: Zoo страница по zooportal_id → поиск в BA по имени → BA дерево
        предков (до 5 поколений) → Zoo патч (registered_name uppercase, zooportal_id
        всегда из Zoo).
      summary: Гибридный импорт одной собаки Zoo→BA
      tags:
      - Import Hybrid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHybridDogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportHybridDogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportHybridDogRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
          description: ''
        '400':
          description: Ошибки валидации
  /api/dogs/import/hybrid/full/dog/:
    post:
      operationId: dogs_import_hybrid_full_dog_create
      description: 'Zoo страница по zooportal_id → поиск в BA по имени → BA полное
        дерево всех предков → Zoo патч. Время: от нескольких минут до нескольких часов.'
      summary: Гибридный импорт одной собаки Zoo→BA (все поколения)
      tags:
      - Import Hybrid Full
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHybridFullDogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportHybridFullDogRequest'
          multipart/form-data:
            schema:
